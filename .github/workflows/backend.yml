name: Backend

on:
  push:
    branches: [prototype-v2]
    paths: [src/backend/**, compose.yaml, .github/workflows/backend.yml]
  pull_request:
    paths: [src/backend/**, compose.yaml, .github/workflows/backend.yml]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: portal67_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORTAL67_TEST_DATABASE_URL: postgres://postgres:portal67_ci@127.0.0.1:5432/postgres?sslmode=disable
      PORTAL67_SPLIT_TEST_ADMIN_URL: postgres://postgres:portal67_ci@127.0.0.1:5432/postgres?sslmode=disable
      PORTAL67_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - run: go test -mod=readonly ./...
        working-directory: src/backend
      - run: go vet ./...
        working-directory: src/backend
      - run: docker compose --profile prototype-v2 config --quiet
